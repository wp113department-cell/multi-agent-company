name: CI

on:
  push:
    branches: ["main", "stage-*", "gap-*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Python backend — lint + typecheck + tests
  # ──────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gridiron
          POSTGRES_PASSWORD: gridiron_dev_only
          POSTGRES_DB: gridiron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://gridiron:gridiron_dev_only@localhost:5432/gridiron_test
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      USE_GROQ: "false"
      SENTRY_DSN: ""
      ALERT_WEBHOOK_URL: ""
      REDIS_URL: "redis://localhost:6379/0"
      REDIS_STREAMS_ENABLED: "false"
      ARTIFACT_BACKEND: "db"
      S3_BUCKET: ""

    steps:
      - uses: actions/checkout@v7
        with:
          # Gap-closure Stage 1.7 (answers.md): scripts/ci_tech_debt_scan.py
          # needs `git diff` against the PR base branch to detect structural
          # file changes. The default shallow (depth-1) checkout only fetches
          # the PR merge commit, so origin/<base> isn't available locally.
          # fetch-depth: 0 fetches full history for all branches/tags.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Format check (black)
        run: python -m black --check .

      - name: Type check (mypy)
        run: python -m mypy app/ --strict --ignore-missing-imports

      - name: Test suite (pytest)
        run: python -m pytest tests/ -v --tb=short --timeout=120 --junitxml=pytest-results.xml

      - name: Regression gate (regression_detector baseline check)
        # Gap-closure Stage 1.7 (answers.md) — app/fleet/regression_detector.py's
        # RegressionDetector.gate_deploy() already existed (Day 11) and was
        # already fully tested (tests/test_regression_detector.py), but was
        # never invoked as its own explicit, visible CI gate — only buried
        # inside the general `pytest tests/` run above. This step runs it
        # by name so a deliberately-regressed benchmark demonstrably fails
        # CI as its own labeled check, not merged into the general suite's
        # pass/fail. Real, deterministic, no LLM call: it constructs its own
        # baseline + regressed run and asserts DeploymentBlocked is raised
        # (tests/test_regression_detector.py::test_gate_deploy_raises_deployment_blocked_on_regression).
        #
        # Known, honest limitation (not solved here): this CI Postgres is a
        # fresh, ephemeral container per run with no baseline history from
        # prior runs, so this step cannot yet catch "did THIS PR regress
        # against the real fleet's stored baseline" the way a real deploy
        # gate against the persistent production DB eventually should —
        # that needs either a persistent CI database or a downloaded
        # baseline artifact from the last successful main-branch run, which
        # is a separate, larger CI-infrastructure change, not implemented
        # as part of this pass.
        run: python -m pytest tests/test_regression_detector.py -v --tb=short

      - name: Tech debt scan (tech_debt_agent on structural PR diffs)
        # Gap-closure Stage 1.7 (answers.md) — second half. User's explicit
        # scoping choice: real LLM call, non-blocking. scripts/ci_tech_debt_scan.py
        # (backend/scripts/ci_tech_debt_scan.py) checks whether this PR's diff
        # touches a structural file (app/fleet/structural_diff.py's
        # STRUCTURAL_FILE_PATTERNS — shared DB schema, the two graph builders,
        # central settings, RBAC/policy, model routing, migrations); if so,
        # and only if ANTHROPIC_API_KEY is configured, it runs tech_debt_agent
        # for real against the repo and posts findings to the job summary as
        # an informational annotation. It always exits 0 — this step can never
        # fail the build, on a push event (no GITHUB_BASE_REF), on a routine
        # non-structural diff, or on an LLM/API error.
        if: github.event_name == 'pull_request'
        run: python scripts/ci_tech_debt_scan.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: backend/pytest-results.xml

  # ──────────────────────────────────────────────────────────────────────
  # TypeScript frontend — typecheck + build
  # ──────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (pnpm audit)
        # Gap-closure post-Day-34 CI hygiene pass (2026-07-31) originally added
        # this as informational/non-blocking: `next` was pinned to 14.2.15
        # while the patched versions required >=15.5.21 — a major-version
        # upgrade with real breaking changes, so failing every build on it
        # then would have blocked unrelated work.
        #
        # Production-hardening pass (2026-08-05): next is now >=15.5.21, the
        # remaining transitive CVEs (esbuild/minimatch/vite/sharp, plus
        # jsdom's own undici copy) are resolved via pnpm-workspace.yaml's
        # `overrides` + a jsdom major bump, and `pnpm audit` is confirmed
        # clean (0 vulnerabilities). Flipping this to a real blocking gate
        # now, matching pip-audit's own gate (SEC-05-019) — a newly
        # introduced vulnerability should fail CI, not just get logged.
        run: pnpm audit

      - name: Type check
        run: pnpm --filter @gridiron/web run typecheck

      - name: Lint (eslint)
        # Gap-closure (Audit 06, INFRA-06-004): the trailing `|| true` made
        # this step always exit 0 regardless of findings, matching the same
        # anti-pattern already fixed for pip-audit (SEC-05-019). Removed.
        # `eslint .` (no --max-warnings) only fails on error-severity rule
        # violations, not plain warnings, so this is a real gate now without
        # being overly strict about next/core-web-vitals' warn-level rules.
        run: pnpm --filter @gridiron/web run lint

      - name: Test (vitest)
        run: pnpm --filter @gridiron/web run test

      - name: Build
        run: pnpm --filter @gridiron/web run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ──────────────────────────────────────────────────────────────────────
  # Playwright E2E — separate job so a flaky browser run never blocks the
  # fast typecheck/build gate above. All specs mock the backend via
  # page.route() fixtures (apps/web/e2e/fixtures.ts) — no live Postgres/
  # agent fleet needed, matching this project's deterministic-CI design.
  # ──────────────────────────────────────────────────────────────────────
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E tests
        run: pnpm --filter @gridiron/web run test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # Security scan — pip-audit
  # ──────────────────────────────────────────────────────────────────────
  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        # Gap-closure (Audit 05 fix, SEC-05-019): the trailing `|| true` this
        # step used to end with made it always exit 0 regardless of what
        # pip-audit found — a security gate that could never fail the build.
        # Removed. If this starts failing on a specific finding that's a
        # known, deliberately-accepted risk, add it to --ignore-vuln
        # explicitly (matching the existing GHSA-jfh8-c2jp-5 entry) rather
        # than reintroducing a blanket suppression.
        #
        # Gap-closure Day 7 (answers.md Q24): PYSEC-2026-1325 (ecdsa
        # 0.19.2, no fix version — an upstream won't-fix) used to be
        # --ignore-vuln'd here because it was a dormant transitive
        # dependency of python-jose[cryptography], never actually reachable
        # since this project's JWT layer only signs HS256. Rather than carry
        # that exception forward indefinitely, backend/app/auth/jwt.py was
        # migrated off python-jose onto PyJWT (requirements.txt), which has
        # no such transitive dependency at all — pip-audit is clean without
        # an ignore for it now.
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-jfh8-c2jp-5
