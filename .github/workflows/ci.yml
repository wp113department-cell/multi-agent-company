name: CI

on:
  push:
    branches: ["main", "stage-*", "gap-*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Python backend — lint + typecheck + tests
  # ──────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gridiron
          POSTGRES_PASSWORD: gridiron_dev_only
          POSTGRES_DB: gridiron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://gridiron:gridiron_dev_only@localhost:5432/gridiron_test
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      USE_GROQ: "false"
      SENTRY_DSN: ""
      ALERT_WEBHOOK_URL: ""
      REDIS_URL: "redis://localhost:6379/0"
      REDIS_STREAMS_ENABLED: "false"
      ARTIFACT_BACKEND: "db"
      S3_BUCKET: ""

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Format check (black)
        run: python -m black --check .

      - name: Type check (mypy)
        run: python -m mypy app/ --strict --ignore-missing-imports

      - name: Test suite (pytest)
        run: python -m pytest tests/ -v --tb=short --timeout=120 --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: backend/pytest-results.xml

  # ──────────────────────────────────────────────────────────────────────
  # TypeScript frontend — typecheck + build
  # ──────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @gridiron/web run typecheck

      - name: Lint (eslint)
        run: pnpm --filter @gridiron/web run lint || true

      - name: Test (vitest)
        run: pnpm --filter @gridiron/web run test

      - name: Build
        run: pnpm --filter @gridiron/web run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ──────────────────────────────────────────────────────────────────────
  # Playwright E2E — separate job so a flaky browser run never blocks the
  # fast typecheck/build gate above. All specs mock the backend via
  # page.route() fixtures (apps/web/e2e/fixtures.ts) — no live Postgres/
  # agent fleet needed, matching this project's deterministic-CI design.
  # ──────────────────────────────────────────────────────────────────────
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E tests
        run: pnpm --filter @gridiron/web run test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # Security scan — pip-audit
  # ──────────────────────────────────────────────────────────────────────
  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        # Gap-closure (Audit 05 fix, SEC-05-019): the trailing `|| true` this
        # step used to end with made it always exit 0 regardless of what
        # pip-audit found — a security gate that could never fail the build.
        # Removed. If this starts failing on a specific finding that's a
        # known, deliberately-accepted risk, add it to --ignore-vuln
        # explicitly (matching the existing GHSA-jfh8-c2jp-5 entry) rather
        # than reintroducing a blanket suppression.
        #
        # PYSEC-2026-1325 (ecdsa 0.19.2, no fix version exists): a known,
        # long-standing upstream won't-fix in python-ecdsa — the library is
        # pure Python and its maintainers have stated timing/side-channel
        # resistance is out of scope for a from-scratch rewrite they don't
        # intend to do. `ecdsa` is a transitive dependency of
        # `python-jose[cryptography]`, not a direct one, and this project's
        # JWT layer (backend/app/auth/jwt.py) signs with HS256 (HMAC, see
        # config.py's jwt_algorithm default) — it never calls into ecdsa's
        # actual sign/verify code paths for ES256, so the exploitable surface
        # for this specific timing attack is dormant here, not reachable.
        # Revisit if jwt_algorithm ever changes to an ES* algorithm.
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-jfh8-c2jp-5 --ignore-vuln PYSEC-2026-1325
