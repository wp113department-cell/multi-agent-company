name: Load Test (k6)

# AUDIT_Q_BATCH06 §11 "Performance Tests"/"Load Tests / Stress Tests" gap-
# closure: tests/load/gridiron_load_test.js (k6) existed and was verified
# manually, but was never wired into any automated pipeline — a performance
# regression would not have been caught before this. Scheduled, not per-PR,
# per the audit's own recommendation (avoids cost/flakiness on every push).
#
# Honest scope note: this project has no provisioned staging deployment to
# target, so — same as this repo's own real-execution pytest coverage
# (backend/tests/test_gap55_56_load_test_and_cicd_inspection.py::
# TestLoadTestScriptRealExecution) — this job stands up a real, live
# instance of the app against an ephemeral CI Postgres and runs k6 against
# that. BASE_URL is still env-driven (matching the script's own zero-
# hardcoding design): pass the `staging_base_url` input to point this at a
# real deployed environment instead, once one exists, with no script changes.

on:
  schedule:
    # 03:00 UTC daily — off peak, clear of the per-push `ci` workflow.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      staging_base_url:
        description: "Optional: run against a real deployed BASE_URL instead of spinning up a local instance"
        required: false
        type: string
      # Sol A41 (2026-10-16): the bearer token for auth-gated endpoints is no
      # longer a workflow input (inputs are visible in the run's details and
      # were pasted into the shell). Store it as the repository secret
      # STAGING_API_TOKEN instead.

concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  k6-load-and-stress:
    name: k6 load + stress
    runs-on: ubuntu-latest
    if: github.event.inputs.staging_base_url == ''
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gridiron
          POSTGRES_PASSWORD: gridiron_dev_only
          POSTGRES_DB: gridiron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://gridiron:gridiron_dev_only@localhost:5432/gridiron_test
      USE_GROQ: "false"
      SENTRY_DSN: ""
      ALERT_WEBHOOK_URL: ""
      REDIS_STREAMS_ENABLED: "false"
      ARTIFACT_BACKEND: "db"
      RBAC_ENABLED: "false"
      # k6 load-test gap-closure (2026-08-13) — GET /api/agents, /api/metrics,
      # /api/tasks have no per-route @limiter.limit override, so they fall
      # through to the blanket rate_limit_default (200/minute, keyed by
      # remote IP — see app/rate_limit.py). All k6 VUs run from this one CI
      # runner IP: at 10 VUs the load profile alone generates ~1,800 req/min
      # against those 3 endpoints combined, ~9x over that per-IP limit,
      # so the majority get 429'd — a real, reproducible finding (confirmed
      # against app/rate_limit.py's own _find_route_handler_recursive fix
      # comment, which documents this exact class of k6 failure), not a
      # database or startup-readiness issue. Disabled here for the same
      # reason RBAC_ENABLED is already false in this job: 10 VUs from one
      # IP is not representative of real distributed traffic, and rate
      # limiting itself is a distinct concern from this job's actual
      # purpose (measuring the app's own throughput/latency under load).
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Install k6
        run: |
          curl -sL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health

      - name: k6 load scenario
        run: k6 run -e BASE_URL=http://127.0.0.1:8000 -e SCENARIO=load tests/load/gridiron_load_test.js

      - name: k6 stress scenario
        run: k6 run -e BASE_URL=http://127.0.0.1:8000 -e SCENARIO=stress tests/load/gridiron_load_test.js

      - name: Dump backend log on failure
        if: failure()
        # this job already runs in backend/ (defaults.run.working-directory);
        # `backend/uvicorn.log` pointed at a file that never existed
        run: cat uvicorn.log || true

  k6-against-staging:
    name: k6 load + stress (staging)
    runs-on: ubuntu-latest
    if: github.event.inputs.staging_base_url != ''

    steps:
      - uses: actions/checkout@v7

      - name: Install k6
        run: |
          curl -sL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      # Sol A41: inputs and secrets reach the shell only as environment
      # variables (never `${{ }}` inside a run: script, which allowed command
      # injection through the URL input), and the URL must be http(s).
      - name: Check the staging URL
        env:
          STAGING_BASE_URL: ${{ github.event.inputs.staging_base_url }}
        run: |
          if [[ ! "$STAGING_BASE_URL" =~ ^https?://[A-Za-z0-9._~:/?#@%=+-]+$ ]]; then
            echo "staging_base_url must be an http(s) URL with plain URL characters only" >&2
            exit 1
          fi

      - name: k6 load scenario
        env:
          STAGING_BASE_URL: ${{ github.event.inputs.staging_base_url }}
          API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
        run: k6 run -e BASE_URL="$STAGING_BASE_URL" -e API_TOKEN="$API_TOKEN" -e SCENARIO=load backend/tests/load/gridiron_load_test.js

      - name: k6 stress scenario
        env:
          STAGING_BASE_URL: ${{ github.event.inputs.staging_base_url }}
          API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
        run: k6 run -e BASE_URL="$STAGING_BASE_URL" -e API_TOKEN="$API_TOKEN" -e SCENARIO=stress backend/tests/load/gridiron_load_test.js
