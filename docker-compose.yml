# Local/dev orchestration only — not a production deployment manifest.
# Postgres/Redis are bound to 127.0.0.1 (host-only, not reachable from the
# network) rather than a secrets-managed internal network, and POSTGRES_PASSWORD
# below defaults to a known dev-only value for zero-config `docker compose up`.
# Override POSTGRES_PASSWORD (and set DATABASE_URL to match) via a .env file or
# your orchestrator's real secrets store before using this anywhere shared.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gridiron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridiron_dev_only}
      POSTGRES_DB: gridiron_dev
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridiron -d gridiron_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
    command: alembic upgrade head
    # AUDIT_Q_BATCH08 §97 "Auto-restart on crash": on-failure (not
    # unless-stopped) — this is a one-shot job that's supposed to exit 0 and
    # stay stopped once migrations succeed (backend's own `condition:
    # service_completed_successfully` depends on that). unless-stopped would
    # restart it forever after every successful exit, fighting that
    # dependency instead of satisfying it. on-failure retries only a real,
    # non-zero-exit migration failure, bounded so a persistently broken
    # migration doesn't loop forever.
    restart: on-failure:3
    environment:
      DATABASE_URL: postgresql+asyncpg://gridiron:${POSTGRES_PASSWORD:-gridiron_dev_only}@db:5432/gridiron_dev
    depends_on:
      db:
        condition: service_healthy

  # NOTE — bash_sandbox_enabled (Settings, default True) routes the 3 fully-
  # generic bash tools through app.policy.sandbox.run_sandboxed(), which
  # requires a `docker` CLI + a reachable Docker daemon *inside this
  # container*. Neither is provided here (backend/Dockerfile has no docker
  # client, and this service has no docker.sock mount), so those tools will
  # raise SandboxUnavailableError rather than silently running unsandboxed —
  # that's the intended fail-closed behavior, not a bug. Two real ways to
  # give the backend container working sandboxed execution:
  #   1. Docker-outside-of-Docker: install the `docker` CLI in
  #      backend/Dockerfile and mount `/var/run/docker.sock:/var/run/docker.sock`
  #      here. Tradeoff: docker.sock access is equivalent to root on the host
  #      — only do this if the host running `docker compose` is itself
  #      disposable/sandboxed infrastructure, not a shared production host.
  #   2. Point sandboxed execution at a remote/isolated Docker host (DOCKER_HOST)
  #      dedicated to this purpose, so a compromised backend container never
  #      has a path to the host it's running on.
  # Until one of those is wired up, either accept that sandboxed bash tools
  # are unavailable, or set BASH_SANDBOX_ENABLED=false as an explicit,
  # operator-acknowledged opt-out (see Settings.bash_sandbox_enabled).
  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # All app settings (API keys, JWT secret, admin password, cost mode...)
    # come from backend/.env when present; the `environment:` entries below
    # win over it, so DATABASE_URL/REDIS_URL always point at these containers.
    env_file:
      - path: ./backend/.env
        required: false
    # AUDIT_Q_BATCH08 §97 "Auto-restart on crash": previously only db/redis
    # had a restart policy — the core service disaster recovery is supposed
    # to protect had none, so it stayed down after any crash until an
    # operator noticed and ran `docker compose up` again.
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://gridiron:${POSTGRES_PASSWORD:-gridiron_dev_only}@db:5432/gridiron_dev
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      QUEUE_BACKEND: ${QUEUE_BACKEND:-asyncio}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_AUTH_ENABLED: ${JWT_AUTH_ENABLED:-false}
      RBAC_ENABLED: ${RBAC_ENABLED:-true}
      ALLOW_LEGACY_ROLE_HEADER: ${ALLOW_LEGACY_ROLE_HEADER:-false}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-gridiron123}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      BASH_SANDBOX_ENABLED: ${BASH_SANDBOX_ENABLED:-true}
      # Repositories live in a folder of the user's computer, mounted at
      # /workspace (the Windows launcher uses Documents\multi-agent-workspace).
      ALLOWED_WORKSPACE_PARENT: /workspace
      REPOS_DIR: /workspace/repos
      WORKSPACE_HOST_LABEL: ${WORKSPACE_HOST_LABEL:-./workspace}
    volumes:
      - ${WORKSPACE_DIR:-./workspace}:/workspace
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RQ worker — enabled via: docker compose --profile rq up
  worker:
    build:
      context: ./backend
    command: rq worker gridiron-high gridiron-default --url ${REDIS_URL:-redis://redis:6379/0} --with-scheduler
    env_file:
      - path: ./backend/.env
        required: false
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://gridiron:${POSTGRES_PASSWORD:-gridiron_dev_only}@db:5432/gridiron_dev
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - rq

  # Frontend — enabled via: docker compose --profile frontend up
  frontend:
    build:
      # Context must be the repo root, not ./apps/web: this is a pnpm
      # workspace, and pnpm-lock.yaml/pnpm-workspace.yaml/the root
      # package.json (all required for `pnpm install` to resolve workspace
      # deps) live outside apps/web. See apps/web/Dockerfile's own header
      # comment for the same reasoning.
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - frontend

  # Daily database backup (production audit 13, OPS-13-006). Runs the same
  # scripts/backup_db.sh as the manual procedure — pg_dump custom format,
  # self-verified with pg_restore --list, newest BACKUP_RETENTION_COUNT kept.
  # Enabled via: docker compose --profile backup up -d backup
  # Set GRIDIRON_BACKUP_DIR (repo-root .env) to a folder on ANOTHER disk —
  # a backup on the database's own disk does not survive losing that disk.
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    entrypoint: ["bash", "-c"]
    command:
      - |
        while true; do
          /scripts/backup_db.sh || echo "BACKUP FAILED at $$(date -u +%FT%TZ)" >&2
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    environment:
      DATABASE_URL: postgresql://gridiron:${POSTGRES_PASSWORD:-gridiron_dev_only}@db:5432/gridiron_dev
      BACKUP_DIR: /backups
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts:/scripts:ro
      - ${GRIDIRON_BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - backup

volumes:
  pgdata:
